[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataiprep"
version = "2.0.0"
description = "Advanced ML Data Quality Assessment Platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mohamed Massaoudi", email = "mohamed.massaoudi@tamu.edu"}
]
maintainers = [
    {name = "Mohamed Massaoudi", email = "mohamed.massaoudi@tamu.edu"}
]
keywords = [
    "data-quality",
    "machine-learning",
    "data-preprocessing",
    "feature-selection",
    "shap",
    "explainability",
    "data-leakage",
    "mlops",
    "data-science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.8"
dependencies = [
    "PyQt6>=6.6.0",
    "PyQt6-SVG>=6.6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.17.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "tqdm>=4.66.0",
    "python-dateutil>=2.8.0",
    "colorama>=0.4.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
]
data = [
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "pyarrow>=14.0.0",
    "fastparquet>=0.8.0",
    "sqlalchemy>=2.0.0",
]
reporting = [
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
    "reportlab>=4.0.0",
]
shap = ["shap>=0.44.0"]
dask = ["dask[complete]>=2023.12.0"]
mlops = [
    "mlflow>=2.9.0",
    "wandb>=0.16.0",
]
full = [
    "fastapi>=0.110.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "pyarrow>=14.0.0",
    "fastparquet>=0.8.0",
    "sqlalchemy>=2.0.0",
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
    "reportlab>=4.0.0",
    "shap>=0.44.0",
    "dask[complete]>=2023.12.0",
    "mlflow>=2.9.0",
    "wandb>=0.16.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/massaoudi-lab/dataiprep"
Documentation = "https://github.com/massaoudi-lab/dataiprep#readme"
Repository = "https://github.com/massaoudi-lab/dataiprep"
Issues = "https://github.com/massaoudi-lab/dataiprep/issues"

[project.scripts]
dataiprep = "main:main"

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*.svg", "*.png", "*.html", "*.css", "*.js"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --cov=src --cov-report=term-missing"

